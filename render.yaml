# One-click deployment of the public demo on Render (Blueprint).
# Everything runs in one container on an ephemeral SQLite database: no
# database service to create, nothing to pay for storage.
services:
  - type: web
    name: order-hub-demo
    runtime: docker
    # Free instance: sleeps when idle, wakes on the next visit with a fresh demo.
    plan: free
    dockerfilePath: ./docker/demo/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Optional: set it to let Claude write the incident analyses.
      - key: ANTHROPIC_API_KEY
        sync: false

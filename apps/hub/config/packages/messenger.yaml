framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine transport on the application database: a message
            # dispatched inside a Doctrine transaction is committed or rolled
            # back with it, which makes the queue itself the outbox (ADR 0005).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 4
                    delay: 1000
                    multiplier: 3
                    max_delay: 60000
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            'App\Application\Message\IngestOrder': async
            'App\Application\Message\AcknowledgeOrder': async
            'App\Application\Message\PollChannel': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                # Listable, unlike in-memory: the replay feature is tested for real.
                failed: 'doctrine://default?queue_name=failed&auto_setup=0'

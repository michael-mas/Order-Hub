parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Application/Message/'

    # The two simulated marketplaces (apps/marketplace). `nova` pushes signed
    # webhooks and is still polled, less often, as a safety net; `atlas` is
    # polling only.
    app.channel.nova:
        class: App\Domain\Channel\Channel
        arguments:
            $code: nova
            $name: Nova Market
            $supportsWebhooks: true
            $apiKey: '%env(NOVA_API_KEY)%'
            $webhookSecret: '%env(NOVA_WEBHOOK_SECRET)%'
            $pollIntervalSeconds: 30

    app.channel.atlas:
        class: App\Domain\Channel\Channel
        arguments:
            $code: atlas
            $name: Atlas Marketplace
            $supportsWebhooks: false
            $apiKey: '%env(ATLAS_API_KEY)%'
            $webhookSecret: ''
            $pollIntervalSeconds: 5

    App\Domain\Channel\ChannelRegistry:
        arguments:
            $channels: ['@app.channel.nova', '@app.channel.atlas']

    App\Domain\Channel\PollingWindow:
        arguments:
            # Covers the simulator's worst visibility delay (20 s in "storm").
            $overlapSeconds: 30
            $initialLookbackSeconds: 900
            $reconciliationSeconds: 900

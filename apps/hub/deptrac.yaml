# Architecture rules, checked in CI: the domain and the application know no
# framework and no infrastructure; controllers reach the use cases only
# through the application; nothing depends on controllers.
deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Entity
      collectors:
        - type: directory
          value: src/Entity/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Controller
      collectors:
        - type: directory
          value: src/Controller/.*
    - name: Framework
      collectors:
        - type: classLike
          value: ^(Symfony|Doctrine|ApiPlatform|Anthropic)\\.*
  ruleset:
    # The domain is plain PHP; the use cases know only the domain and their
    # own ports (ADR 0008).
    Domain: ~
    Application:
      - Domain
    # Persistence and API read models: framework metadata, no logic.
    Entity:
      - Framework
    Infrastructure:
      - Application
      - Domain
      - Entity
      - Framework
    Controller:
      - Application
      - Domain
      - Framework

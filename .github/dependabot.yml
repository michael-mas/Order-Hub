# Weekly update proposals; each one goes through the whole CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: composer
    directory: /apps/hub
    schedule: { interval: weekly }
    groups:
      composer: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/apps/hub, /apps/console, /apps/marketplace, /docker/demo]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs read the code; only the image publication writes.
permissions:
  contents: read

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  node:
    name: Simulator and console (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - run: npm run build --workspace @order-hub/console

  supply-chain:
    name: Dependencies, Dockerfiles and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node dependencies have no known vulnerability
        run: npm audit --audit-level=low
      - name: PHP dependencies have no known vulnerability, none abandoned
        run: docker run --rm -v "$PWD/apps/hub:/app" -w /app composer:2@sha256:9715c7f69044da2a212a5fbde29ee7da24e364d426560ae6367b060236f847d7 audit --locked
      - name: Dockerfiles (Hadolint, every level)
        run: |
          for f in apps/hub/Dockerfile apps/console/Dockerfile apps/marketplace/Dockerfile docker/demo/Dockerfile; do
            echo "$f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold info - < "$f"
          done
      - name: Shell scripts (ShellCheck)
        run: shellcheck docker/demo/start.sh e2e/stack.sh

  hub:
    name: Hub (PHP, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PostgreSQL for deployments, SQLite for the self-contained demo.
        database: [postgresql, sqlite]
    env:
      DATABASE_URL: ${{ matrix.database == 'sqlite' && 'sqlite:///%kernel.project_dir%/var/ci.db' || 'postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8' }}
    defaults:
      run:
        working-directory: apps/hub
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('apps/hub/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict --no-check-publish
      - if: matrix.database == 'postgresql'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - if: matrix.database == 'postgresql'
        run: vendor/bin/phpstan analyse --no-progress
      - if: matrix.database == 'postgresql'
        run: vendor/bin/deptrac analyse --no-progress
      - run: bin/console lint:container
      - run: bin/console lint:yaml config
      - name: Database (PostgreSQL, through the migrations)
        if: matrix.database == 'postgresql'
        run: |
          bin/console doctrine:database:create --env=test --if-not-exists
          bin/console doctrine:migrations:migrate --env=test --no-interaction
          bin/console doctrine:schema:validate --env=test
      - name: Database (SQLite, as the demo creates it)
        if: matrix.database == 'sqlite'
        run: |
          bin/console doctrine:schema:create --env=test
          bin/console doctrine:schema:validate --env=test
      - run: vendor/bin/phpunit

  e2e:
    name: End to end and resilience
    needs: [node, hub]
    runs-on: ubuntu-latest
    env:
      # Shared by e2e/stack.sh and the tests that drive the simulator directly.
      HUB_API_TOKEN: e2e-hub-token
      SIMULATOR_CONTROL_TOKEN: e2e-control-token
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --no-progress
        working-directory: apps/hub
      - run: npm ci
      - run: npm run build --workspace @order-hub/console
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: e2e/stack.sh start
      - run: npx playwright test
        working-directory: e2e
        env:
          STORM_MS: '60000'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/.stack/*.log
          retention-days: 7
      - if: always()
        run: e2e/stack.sh stop

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build
      - name: Whole system starts
        run: |
          docker compose up -d
          for url in http://localhost:8000/health http://localhost:8100/health http://localhost:3000; do
            for i in $(seq 1 60); do curl -fs -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url"
          done
          curl -fsS http://localhost:3000/api/hub/api/channels
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  demo:
    name: Demo image (SQLite, single container)
    needs: [node, hub]
    runs-on: ubuntu-latest
    env:
      SIMULATOR_CONTROL_TOKEN: ci-control-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker build -f docker/demo/Dockerfile -t order-hub-demo .
      - name: Known vulnerabilities in the image (Trivy)
        run: |
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
              -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed --ignorefile /.trivyignore.yaml --no-progress "$@" order-hub-demo
          }
          # Every fixable HIGH or CRITICAL finding is listed; a CRITICAL one
          # not accepted in .trivyignore.yaml fails the build.
          scan --severity HIGH,CRITICAL
          scan --severity CRITICAL --exit-code 1 --skip-db-update
      - name: Start the demo as a host would, the simulator opened for the tests
        run: |
          docker run -d --name demo --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 -p 8100:8100 -e PORT=3000 \
            -e SIMULATOR_HOST=0.0.0.0 -e SIMULATOR_CONTROL_TOKEN="$SIMULATOR_CONTROL_TOKEN" order-hub-demo
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: End to end and resilience, against the demo container
        run: npx playwright test
        working-directory: e2e
        env:
          STORM_MS: '60000'
      - name: Memory used by the whole demo after the suites
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' demo
      - if: failure()
        run: docker logs demo
      - if: always()
        run: docker rm -f demo

  demo-constrained:
    name: Demo image on a small free instance (512 MB, 0.1 CPU)
    needs: [demo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker build -f docker/demo/Dockerfile -t order-hub-demo .
      - name: Start with the limits of a free instance, and time it
        run: |
          start=$(date +%s)
          docker run -d --name demo --cap-drop ALL --security-opt no-new-privileges --memory=512m --cpus=0.1 -p 3000:3000 -e PORT=3000 order-hub-demo
          for i in $(seq 1 150); do curl -fs -o /dev/null http://127.0.0.1:3000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health
          echo "healthy after $(( $(date +%s) - start )) s"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: The console works on the small instance
        run: npx playwright test tests/console.spec.ts --project desktop
        working-directory: e2e
      - name: Memory used on the small instance
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' demo
      - if: failure()
        run: docker logs demo
      - if: always()
        run: docker rm -f demo

  publish-demo:
    name: Publish the demo image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [demo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/michael-mas/order-hub-demo
        run: |
          image=ghcr.io/michael-mas/order-hub-demo
          docker build -f docker/demo/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/michael-mas/Order-Hub \
            -t "$image:latest" -t "$image:${GITHUB_SHA::7}" .
          docker push --all-tags "$image"

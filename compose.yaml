# Everything, locally: `docker compose up --build`, then open
# http://localhost:3000. Demo secrets only; override them for any deployment.
# Ports are published on 127.0.0.1 only: nothing here is meant for a network.
# Application containers run without any Linux capability, as strict hosts do.

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']

x-hub-env: &hub-env
  APP_SECRET: ${APP_SECRET:-change-me-for-any-real-deployment}
  DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  MARKETPLACE_BASE_URL: http://marketplace:8100
  NOVA_API_KEY: nova-demo-key
  NOVA_WEBHOOK_SECRET: nova-demo-webhook-secret
  ATLAS_API_KEY: atlas-demo-key
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
  HUB_API_TOKEN: ${HUB_API_TOKEN:-compose-hub-token}

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app']
      interval: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  migrate:
    <<: *hardened
    build: apps/hub
    environment: *hub-env
    command:
      [
        'php',
        'bin/console',
        'doctrine:migrations:migrate',
        '--no-interaction',
        '--allow-no-migration',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  hub:
    <<: *hardened
    build: apps/hub
    environment: *hub-env
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *hardened
    build: apps/hub
    environment: *hub-env
    command:
      ['php', 'bin/console', 'messenger:consume', 'async', 'scheduler_default', '--time-limit=3600']
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  marketplace:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/marketplace/Dockerfile
    environment:
      HUB_URL: http://hub:8000
      CONTROL_TOKEN: ${SIMULATOR_CONTROL_TOKEN:-compose-control-token}
    ports: ['127.0.0.1:8100:8100']

  console:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    environment:
      HUB_URL: http://hub:8000
      HUB_API_TOKEN: ${HUB_API_TOKEN:-compose-hub-token}
      SIMULATOR_URL: http://marketplace:8100
      SIMULATOR_CONTROL_TOKEN: ${SIMULATOR_CONTROL_TOKEN:-compose-control-token}
    ports: ['127.0.0.1:3000:3000']
    depends_on: [hub, marketplace]

volumes:
  postgres:

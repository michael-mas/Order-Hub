# Everything, locally: `docker compose up --build`, then open
# http://localhost:3000. Demo secrets only; override them for any deployment.

x-hub-env: &hub-env
  APP_SECRET: ${APP_SECRET:-change-me-for-any-real-deployment}
  DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=16&charset=utf8
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  MARKETPLACE_BASE_URL: http://marketplace:8100
  NOVA_API_KEY: nova-demo-key
  NOVA_WEBHOOK_SECRET: nova-demo-webhook-secret
  ATLAS_API_KEY: atlas-demo-key
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app']
      interval: 3s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data

  migrate:
    build: apps/hub
    environment: *hub-env
    command:
      [
        'php',
        'bin/console',
        'doctrine:migrations:migrate',
        '--no-interaction',
        '--allow-no-migration',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  hub:
    build: apps/hub
    environment: *hub-env
    ports: ['8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: apps/hub
    environment: *hub-env
    command:
      ['php', 'bin/console', 'messenger:consume', 'async', 'scheduler_default', '--time-limit=3600']
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  marketplace:
    build:
      context: .
      dockerfile: apps/marketplace/Dockerfile
    environment:
      HUB_URL: http://hub:8000
    ports: ['8100:8100']

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    environment:
      HUB_URL: http://hub:8000
      SIMULATOR_URL: http://marketplace:8100
    ports: ['3000:3000']
    depends_on: [hub, marketplace]

volumes:
  postgres:
